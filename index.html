<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aditya S — Portfolio</title>
<meta name="description" content="Versions of the personal portfolio of Aditya S, an Information Science Engineering student building software, AI automations and developer tools.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { color-scheme: dark; --bg:#0a0a0a; --surface:#111111; --text:#f5f5f5; --muted:#a1a1aa; --accent:#3b82f6; --border:#27272a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
  .wrap { width:100%; max-width:560px; }
  h1 { font-size:1.5rem; letter-spacing:-0.01em; }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.6875rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); }
  p.sub { color:var(--muted); font-size:0.875rem; line-height:1.6; margin-top:0.75rem; }
  ul { list-style:none; margin-top:2rem; display:grid; gap:0.75rem; }
  a.card { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1rem 1.25rem; border:1px solid var(--border); border-radius:0.75rem; background:var(--surface); color:var(--text); text-decoration:none; transition:border-color .2s, color .2s; }
  a.card:hover { border-color:var(--accent); }
  a.card span:first-child { font-weight:600; font-size:0.9375rem; }
  a.card span:last-child { color:var(--muted); font-size:0.75rem; }
  a.card .tag { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.625rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--accent); border:1px solid rgba(59,130,246,.4); padding:0.2rem 0.5rem; border-radius:0.375rem; }
  footer { margin-top:2.5rem; color:var(--muted); font-size:0.75rem; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="mono">Aditya S — Portfolio</p>
    <h1>Portfolio versions</h1>
    <p class="sub">Experimental versions of my personal portfolio, updated as I refine the design and content.</p>
    <ul>
      <li><a class="card" href="4-devportfolio/"><span>Professional Portfolio</span><span class="tag">Recommended</span></a></li>
      <li><a class="card" href="5-gitprofile/"><span>Developer Dashboard</span><span class="tag">v5</span></a></li>
      <li><a class="card" href="1/"><span>Academic Theme</span><span class="tag">v1</span></a></li>
      <li><a class="card" href="2/"><span>Engineering Journal</span><span class="tag">v2</span></a></li>
    </ul>
    <footer>© 2026 Aditya S</footer>
  </div>
</body>
</html>
